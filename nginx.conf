# ================================================================================
# Nginx Configuration for InnoviaBurst SPA
# ================================================================================
# This configuration file handles:
# 1. SPA routing (try_files fallback to index.html)
# 2. Proper caching headers for hashed assets (1-year immutable)
# 3. No caching for HTML to allow fast deployments
# 4. Correct MIME types and security headers
# 5. Gzip compression for text-based assets
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/innoviaburst.com
#   2. Create symlink: ln -s /etc/nginx/sites-available/innoviaburst.com /etc/nginx/sites-enabled/
#   3. Test config: nginx -t
#   4. Reload: systemctl reload nginx
# ================================================================================

server {
    listen 80;
    listen [::]:80;
    server_name innoviaburst.com www.innoviaburst.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name innoviaburst.com www.innoviaburst.com;

    # SSL certificates (update paths to your actual certificate locations)
    ssl_certificate /etc/letsencrypt/live/innoviaburst.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innoviaburst.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Document root - update to your actual dist folder path
    root /var/www/innoviaburst/dist;
    index index.html;

    # ==========================================
    # Security Headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ==========================================
    # Gzip Compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ==========================================
    # Static Assets with Long Cache (Hashed Filenames)
    # ==========================================
    # Vite generates hashed filenames like: /assets/index-abc123.js
    # These can be cached aggressively since the hash changes on content change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Enable gzip for assets
        gzip_static on;
        
        # Try to serve pre-compressed .gz files if available
        try_files $uri $uri/ =404;
    }

    # ==========================================
    # Robots.txt and Sitemap - Short Cache
    # ==========================================
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/xml; charset=utf-8";
        try_files $uri =404;
    }

    # ==========================================
    # Favicons and Manifest - Medium Cache
    # ==========================================
    location ~* ^/(favicon\.ico|site\.webmanifest|apple-touch-icon.*\.png|favicon-.*\.png)$ {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ==========================================
    # Images in public folder - Medium Cache
    # ==========================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ==========================================
    # API Proxy (if you have a backend)
    # ==========================================
    # Uncomment and configure if you have an API server
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # ==========================================
    # Noindex for utility/private routes
    # ==========================================
    # These routes should not be indexed by search engines
    # The SPA will still render them, but with X-Robots-Tag header
    location ~ ^/(auth|login|admin|dashboard|api) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # SPA Fallback - The Critical Part!
    # ==========================================
    # This is what prevents 5xx errors on direct navigation to SPA routes
    # try_files checks: 1) exact file, 2) directory, 3) fallback to index.html
    location / {
        # No caching for HTML (allows instant deployment updates)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # SPA routing: serve index.html for all non-file routes
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # Error Pages
    # ==========================================
    # For 404 on non-existing static files, return proper 404
    # The SPA will handle route-level 404s via React Router
    error_page 404 /index.html;
    
    # Disable logging for common files
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # ==========================================
    # Deny access to hidden files (except .well-known for SSL)
    # ==========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.well-known {
        allow all;
    }
}
