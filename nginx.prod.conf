# ================================================================================
# Nginx Configuration for InnoviaBurst SPA
# ================================================================================
# Purpose: Serve Vite React SPA statically with proper caching and SPA routing
# Domain: innoviaburst.com
# Root: /var/www/innoviaburst/dist
#
# Last updated: 2026-01-08
# ================================================================================

# --- OPTIONAL (currently disabled) ---
# WebSocket upgrade map - uncomment when backend needs WebSocket support
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# Lead-capture API (server/index.mjs, started by deploy.sh under pm2).
# Holds the SMTP credentials and sends the notification mail.
upstream innoviaburst_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ==========================================
# Locale negotiation for the site root "/"
# ==========================================
# `/` is NOT a permanent redirect to one locale — it is content-negotiated per
# visitor so a French user lands on /fr/ and everyone else on /en/:
#   1. an explicit `locale` cookie (set by the on-site language switcher) wins;
#   2. otherwise the browser's primary Accept-Language tag;
#   3. otherwise `en` (the default / x-default locale).
# These mirror negotiateLocale() in scripts/site-content.mjs. The `location = /`
# block below returns a 302 (never 301) + Vary so the choice is never cached
# permanently and can change when the user's preference changes.
map $http_accept_language $ib_lang_header {
    default   en;
    ~*^fr     fr;   # fr, fr-FR, fr-CA, ...
}
map $cookie_locale $ib_lang {
    default   $ib_lang_header;   # no explicit choice -> use Accept-Language
    ~*^fr     fr;                # explicit switch to French wins
    ~*^en     en;                # explicit switch to English wins
}

# ==========================================
# HTTP → HTTPS Redirect (Port 80)
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name innoviaburst.com www.innoviaburst.com;

    # ACME challenge for Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# HTTPS Server (Port 443)
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name innoviaburst.com www.innoviaburst.com;

    # ------------------------------------------
    # SSL Configuration
    # ------------------------------------------
    ssl_certificate /etc/letsencrypt/live/innoviaburst.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innoviaburst.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL protocols only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (uncomment after confirming HTTPS works correctly)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # ------------------------------------------
    # Document Root
    # ------------------------------------------
    # Vike pre-renders the static site into dist/client (this is the web root).
    root /var/www/innoviaburst/dist/client;
    index index.html;

    # ==========================================
    # 301 Redirects — locale migration (Phase 1)
    # ==========================================
    # Every legacy flat URL -> its /en/ equivalent (preserves link equity).
    # `/work` consolidates into `/works`. These mirror legacyRedirects() in
    # scripts/site-content.mjs — when Phase 5 adds /fr/, update both.
    #
    # `/` is the exception: content-negotiated per visitor (302 + Vary), not a
    # permanent 301. $ib_lang resolves via the maps at the top of this file.
    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 302 /$ib_lang/$is_args$args;
    }
    location = /automations      { return 301 /en/automations; }
    location = /resources        { return 301 /en/resources; }
    location = /industries       { return 301 /en/industries; }
    location = /trust            { return 301 /en/trust; }
    location = /subprocessors    { return 301 /en/subprocessors; }
    location = /privacy          { return 301 /en/privacy; }
    location = /cookies          { return 301 /en/cookies; }
    location = /terms            { return 301 /en/terms; }
    location = /works            { return 301 /en/works; }
    location = /coming-soon      { return 301 /en/coming-soon; }
    location = /ai-ops-sprint    { return 301 /en/ai-ops-sprint; }
    location = /automation-build { return 301 /en/automation-build; }
    location = /mvp-launch       { return 301 /en/mvp-launch; }
    location = /work             { return 301 /en/works; }
    location = /work/professional-services-client-onboarding { return 301 /en/work/professional-services-client-onboarding; }
    location = /work/saas-support-ticket-triage              { return 301 /en/work/saas-support-ticket-triage; }

    # ------------------------------------------
    # Security Headers
    # ------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ------------------------------------------
    # Gzip Compression
    # ------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ------------------------------------------
    # Static Assets - Long Cache (Hashed Filenames)
    # ------------------------------------------
    # Vite generates hashed filenames: /assets/index-abc123.js
    # Safe to cache aggressively - hash changes when content changes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
        try_files $uri =404;
    }

    # ------------------------------------------
    # robots.txt - Short Cache
    # ------------------------------------------
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ------------------------------------------
    # sitemap.xml - Short Cache
    # ------------------------------------------
    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/xml; charset=utf-8";
        try_files $uri =404;
    }

    # ------------------------------------------
    # llms.txt - AI crawler info
    # ------------------------------------------
    location = /llms.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ------------------------------------------
    # Favicons and Manifest - Medium Cache
    # ------------------------------------------
    location ~* ^/(favicon\.ico|site\.webmanifest|apple-touch-icon.*\.png|favicon-.*\.png)$ {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ------------------------------------------
    # Images - Medium Cache
    # ------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ------------------------------------------
    # Noindex for Utility/Private Routes
    # ------------------------------------------
    # Prevents indexing of auth, login, admin, dashboard pages
    # NOTE: /api is NOT included here (API routes don't need noindex header)
    location ~ ^/(auth|login|admin|dashboard) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/index.html =404;
    }

    # ------------------------------------------
    # Lead-capture API
    # ------------------------------------------
    # `^~` matters: it outranks the regex noindex location below, so /api/
    # reaches the proxy instead of falling through to the SPA. The upstream is
    # 127.0.0.1 only — the API is never exposed directly.
    location ^~ /api/ {
        proxy_pass http://innoviaburst_upstream;
        proxy_http_version 1.1;

        # Proxy headers. X-Forwarded-For is load-bearing: the API rate-limits
        # per IP, and without it every request looks like it came from nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sending mail can be slow; 60s is generous but bounded.
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Never cache a lead submission.
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------
    # Pre-rendered HTML routing (SSG)
    # ------------------------------------------
    # Serve the exact pre-rendered file/dir. Unknown URLs return a REAL 404
    # (no SPA fallback to index.html — that was the soft-404 source).
    location / {
        # No caching for HTML - allows instant deployment updates
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Security headers (must repeat as location block overrides server-level)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1) exact file, 2) directory's index.html, else real 404
        try_files $uri $uri/index.html =404;
    }

    # ------------------------------------------
    # Deny Hidden Files (except .well-known)
    # ------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------
    # Disable Logging for Common Files
    # ------------------------------------------
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # ------------------------------------------
    # Error Handling
    # ------------------------------------------
    # Serve the fully pre-rendered /en/404 page WITH a real 404 status.
    # (/en/404 is SSG'd from the NotFound component — title, body, noindex.)
    error_page 404 /en/404/index.html;
    location = /en/404/index.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
