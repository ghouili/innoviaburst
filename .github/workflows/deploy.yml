name: Deploy InnoviaBurst (Production)

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  # ----------------------------
  # OPTIONAL: tests (commented)
  # Uncomment if you actually have tests configured.
  # ----------------------------
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Run unit tests
  #       run: npm test

  deploy:
    # If you enable tests above, uncomment this:
    # needs: test

    runs-on: ubuntu-latest
    environment: deploy

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

      # Variables (Environment -> deploy -> Variables)
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
      BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}

      # Optional vars you can create if you want:
      # RESTART_CMD: ${{ vars.RESTART_CMD }}
      # NVM_DIR: ${{ vars.NVM_DIR }}
      # PM2_APP: ${{ vars.PM2_APP }}
      # APP_PORT: ${{ vars.APP_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Docs: webfactory/ssh-agent expects SSH_PRIVATE_KEY in secrets. :contentReference[oaicite:1]{index=1}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
        # (Optional) If you prefer strict pinning, you can store known_hosts content in a secret instead.

      - name: Upload deploy script
        run: |
          scp -P "$SSH_PORT" deploy.sh "$SSH_USERNAME@$SSH_HOST:/tmp/deploy.sh"

      # ----------------------------
      # Lead-API secrets (SMTP / Gmail App Password).
      #
      # These MUST travel this way rather than in the repo's .env: that file is
      # tracked, and its VITE_ values are inlined into the public JS bundle. A
      # Gmail App Password there would be published twice over.
      #
      # Create a secret in Environment "deploy" named INNOVIABURST_SERVER_ENV
      # containing the contents of server/.env.example with real values.
      # deploy.sh moves it to server/.env (chmod 600) before starting the API.
      # ----------------------------
      - name: Upload lead-api env payload
        run: |
          printf "%s" "${{ secrets.INNOVIABURST_SERVER_ENV }}" > server.env.payload
          scp -P "$SSH_PORT" server.env.payload "$SSH_USERNAME@$SSH_HOST:/tmp/innoviaburst.server.env"
          rm server.env.payload

      # ----------------------------
      # OPTIONAL: client .env payload (still commented).
      # The tracked .env already ships every VITE_ value, so this is only needed
      # if you ever want them to differ per environment.
      # ----------------------------
      # - name: Upload env payload
      #   run: |
      #     echo "${{ secrets.INNOVIABURST_ENV }}" > env.payload
      #     scp -P "$SSH_PORT" env.payload "$SSH_USERNAME@$SSH_HOST:/tmp/innoviaburst.env"
      #     rm env.payload

      - name: Execute remote deployment
        run: |
          ssh -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "\
            APP_DIR='${DEPLOY_PATH}' \
            REPO_URL='git@github.com:${{ github.repository }}.git' \
            BRANCH='production' \
            NVM_DIR='${{ vars.NVM_DIR }}' \
            BUILD_DIR='${BUILD_DIR}' \
            ENV_PAYLOAD_PATH='/tmp/innoviaburst.env' \
            API_ENV_PAYLOAD_PATH='/tmp/innoviaburst.server.env' \
            PM2_APP='${{ vars.PM2_APP }}' \
            APP_PORT='${{ vars.APP_PORT }}' \
            API_PM2_APP='innoviaburst-api' \
            API_PORT='3000' \
            bash /tmp/deploy.sh \
          "
